<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Game</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1 class="title">💡 Tech Quiz Game</h1>
    
    <div id="quiz-box" class="card">
      <p id="question-text"></p>
      <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off" />
      <button onclick="submitAnswer()">Submit</button>
    </div>

    <div id="result-box" class="card" style="display:none;">
      <h2>Your Score:</h2>
      <p id="final-score"></p>
      <button onclick="restartQuiz()">Play Again</button>
    </div>
  </div>
  
  <footer>
    <p>Made with 💻 for fun!</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
